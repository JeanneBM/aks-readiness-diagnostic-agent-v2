name: kind lab recording

# Manual only: builds the lab images, records every scenario on a fresh kind cluster,
# replays the rules on the valid recordings and uploads everything as an artifact.
# Commit a recording to cases/recorded/ only after reviewing it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: helm/kind-action@v1
        with:
          cluster_name: readiness-lab
      - name: Record scenarios
        run: python tools/record_lab.py --context kind-readiness-lab --output "recordings/run-${{ github.run_id }}"
      - name: Replay rules on valid recordings
        if: always()
        run: readiness-triage evaluate --cases "recordings/run-${{ github.run_id }}" --output "recordings/replay-${{ github.run_id }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kind-recording-${{ github.run_id }}
          path: recordings/
