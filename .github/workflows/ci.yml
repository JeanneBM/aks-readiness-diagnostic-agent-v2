name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Fixtures are reproducible from tools/make_fixtures.py
        run: |
          python tools/make_fixtures.py --output "$RUNNER_TEMP/fixtures"
          diff -r cases/dev "$RUNNER_TEMP/fixtures"
      - name: Rules replay on the development fixtures
        run: readiness-triage evaluate --cases cases/dev --output "$RUNNER_TEMP/replay"

  lab-apps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - working-directory: lab/apps/go
        run: go vet ./... && go build ./...
      - run: python -m py_compile lab/apps/uvicorn/app.py lab/scenarios.py tools/record_lab.py
