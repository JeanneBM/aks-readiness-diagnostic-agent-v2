[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aks-readiness-diagnostic-agent-v2"
version = "0.2.0"
description = "Read-only Kubernetes readiness triage: rules, one LLM call, or rules with LLM fallback, compared on the same evidence"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
readiness-triage = "readiness_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
